services:
  - type: web
    name: researchlens-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash backend/server.sh
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: VECTOR_STORE_TYPE
        value: faiss
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
    plan: free
