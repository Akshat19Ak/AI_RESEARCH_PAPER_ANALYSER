services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../backend/src:/app/backend/src
      - ../backend/api:/app/backend/api
    restart: unless-stopped

  frontend:
    build: ../frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
